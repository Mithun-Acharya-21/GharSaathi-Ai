version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: gharsaathi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gharsaathi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gharsaathi"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gharsaathi_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "GharSaathi Maths API"
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/gharsaathi
      GNANI_API_KEY: ${GNANI_API_KEY:-}
      GNANI_STT_URL: ${GNANI_STT_URL:-https://api.vachana.ai/stt/v3}
      GNANI_STT_LANGUAGE_DEFAULT: ${GNANI_STT_LANGUAGE_DEFAULT:-kn-IN}
      GNANI_STT_FORMAT: ${GNANI_STT_FORMAT:-verbatim}
      GNANI_STT_TIMEOUT_SECONDS: ${GNANI_STT_TIMEOUT_SECONDS:-30}
      GNANI_TTS_ENABLED: ${GNANI_TTS_ENABLED:-false}
      GNANI_TTS_URL: ${GNANI_TTS_URL:-https://api.vachana.ai/api/v1/tts/inference}
      GNANI_TTS_MODEL: ${GNANI_TTS_MODEL:-timbre-v2.5}
      GNANI_TTS_LANGUAGE_DEFAULT: ${GNANI_TTS_LANGUAGE_DEFAULT:-kn-IN}
      GNANI_TTS_VOICE_KN: ${GNANI_TTS_VOICE_KN:-Saanvi}
      GNANI_TTS_VOICE_EN: ${GNANI_TTS_VOICE_EN:-Kaveri}
      GNANI_TTS_TIMEOUT_SECONDS: ${GNANI_TTS_TIMEOUT_SECONDS:-30}
      TEACHER_API_KEY: ${TEACHER_API_KEY:-dev-teacher-secret-key-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      MAX_AUDIO_SIZE_MB: 10
      MAX_AUDIO_DURATION_SECONDS: 60
      MAX_TRANSCRIPT_LENGTH: 2000
      MAX_TRANSCRIPTIONS_PER_SESSION: 10
      SESSION_TOKEN_TTL_HOURS: 24
      DATA_RETENTION_DAYS: 30
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
